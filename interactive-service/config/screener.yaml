screener:
  # IB scanner parameters
  scan_code: "TOP_PERC_GAIN"     # Rank by pre-market % gainers
  instrument: "STK"
  stockTypeFilter : "STOCK"     # Filter out ETFs/ETNs (stockType check via IB ContractDetails)
  location_code: "STK.US.MAJOR"  # NYSE + NASDAQ major stocks
  number_of_rows: 20  # Max symbols per IB scanner call (hard cap = 50)
  

  # Split market cap into two independent IB scanner calls → up to 100 unique candidates total
  # Each bucket independently returns its top 50 gainers; Phase 1 handles all cheaply
  scan_batches:
    - market_cap_min_usd: 2000000000    # $2B–$15B mid-large cap
      market_cap_max_usd: 15000000000
    - market_cap_min_usd: 15000000000   # $15B+ mega cap
      market_cap_max_usd: null

  # ── Client-side liquidity filter (applied after historical bars are fetched) ──
  # Checked against the 20-day average daily volume computed from historical bars,
  # NOT today's cumulative volume — IB's scanner has no true "average volume" filter,
  # and using its aboveVolume (current-session volume) would wrongly drop most
  # pre-market candidates before volume has accumulated for the day.
  avg_volume_min: 600000         # min 20-day average daily volume (shares)

  # ── Phase 1 filters (applied after market snapshot — before expensive historical calls) ──
  # These run on streaming tick data only (fast). Volume is NOT filtered here because
  # the streaming tick undercounts by 40–50% and would incorrectly drop valid stocks.
  exclude_etfs: true             # drop ETFs/ETNs from results (stockType check via IB ContractDetails)
  price_min: 2.0                 # minimum stock price (filters penny stocks)
  pre_market_chg_pct_min: 2  # defualt 2% minimum pre-market change % — drops flat/down stocks before expensive fetches
                                 # Set to null to disable

  # ── Phase 2 filters (applied after historical bars and pre-market bars are fetched) ──
  atr_min: 4.0                   # minimum ATR as a percentage (e.g., 4.0 = 4%)
                                 # Note: ATR period is configured in settings.yaml under ib_data.atr_period
  pre_market_vol_min: 1000       # minimum pre-market shares traded 1000 (uses accurate TRADES bar sum)
  exclude_sectors:
    - "Health Care"
    # Uncomment to add more sector exclusions:
    # - "Energy"
    # - "Utilities"
    # - "Consumer Defensive"

