# Custom Indicators Configuration - Test custom parameter values
# Use this to verify custom ATR/RSI/EMA periods work correctly

ib_gateway:
  host: "127.0.0.1"
  port: 4002
  client_id: 1
  timeout: 30

pacing:
  historical_delay_seconds: 0.6
  market_data_delay_seconds: 0.1
  max_concurrent_mkt_data: 50
  historical_request_timeout_seconds: 45.0

output:
  directory: "./output"
  filename_prefix: "custom_indicators"

pre_market:
  check_hours: false
  tz: "America/New_York"

scheduler:
  enabled: false

ib_data:
  # Custom indicators configuration - demonstrates custom parameter values
  fetch_contract_details: true
  fetch_daily_bars: true
  fetch_market_snapshot: true
  fetch_pre_market_bars: true
  fetch_prev_session_vwap: true
  fetch_volume_profile: true
  fetch_benchmark: true
  
  # Custom indicator parameters (different from defaults)
  fetch_atr: true
  atr_period: 20              # Custom ATR period (default is 14)
                              # Output field: atr.period will show 20
  
  fetch_ema: true
  ema_periods: [5, 10, 21, 55, 100]  # Custom EMA periods (default is [9, 20, 50, 200])
                                      # Output fields: ema.ema_5, ema.ema_10, ema.ema_21, ema.ema_55, ema.ema_100
  
  fetch_rsi: true
  rsi_period: 10              # Custom RSI period (default is 14)
                              # Output field: rsi_10 (field name changes with period)
  
  fetch_bid_ask: true
  fetch_volume: true
  daily_bars_duration: "500 D"  # Extended duration for longer EMAs (default is "300 D")
  pre_market_rvol_lookback: 30  # Extended lookback (default is 20)
  volume_profile_sessions: 5    # More sessions for volume profile (default is 3)
  fetch_sector: true
  fetch_industry: true
  fetch_stock_type: true

max_number_of_stocks: 70
benchmark_symbol: "QQQ"  # Custom benchmark (NASDAQ instead of SPY)

external_apis:
  fmp_api_key: ""                 # add your FMP key here to enable news_catalysts
  news_max_headlines: 5           # fetch up to 5 news items per stock (more than default 3)
